
name: Forge Edit Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Forge Edit APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          if [[ -f "$ROOT/pubspec.yaml" ]]; then
            PROJECT_DIR="$ROOT"
          elif [[ -f "$ROOT/forge_edit/pubspec.yaml" ]]; then
            PROJECT_DIR="$ROOT/forge_edit"
          else
            ZIP_FILE=""

            for candidate in \
              "$ROOT/forge_edit_github_ready.zip" \
              "$ROOT/forge_edit_stage9_final.zip"; do
              if [[ -f "$candidate" ]]; then
                ZIP_FILE="$candidate"
                break
              fi
            done

            if [[ -z "$ZIP_FILE" ]]; then
              ZIP_FILE="$(find "$ROOT" -maxdepth 1 -type f -name '*.zip' -print -quit || true)"
            fi

            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: Flutter project or project ZIP not found."
              exit 1
            fi

            EXTRACT_DIR="$ROOT/.ci-build-source"
            mkdir -p "$EXTRACT_DIR"
            unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"

            PUBSPEC="$(find "$EXTRACT_DIR" -type f -name pubspec.yaml -print -quit)"
            if [[ -z "$PUBSPEC" ]]; then
              echo "ERROR: pubspec.yaml not found inside ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Update Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          settings = project / "android/settings.gradle"
          if settings.exists():
              text = settings.read_text()

              text, count_agp = re.subn(
                  r'(id\s+"com\.android\.application"\s+version\s+")[^"]+(")',
                  r'\g<1>8.11.1\2',
                  text,
                  count=1,
              )

              text, count_kotlin = re.subn(
                  r'(id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+")[^"]+(")',
                  r'\g<1>2.2.20\2',
                  text,
                  count=1,
              )

              if count_agp:
                  print("Updated Android Gradle Plugin.")
              if count_kotlin:
                  print("Updated Kotlin plugin.")

              settings.write_text(text)

          wrapper = project / "android/gradle/wrapper/gradle-wrapper.properties"
          if wrapper.exists():
              text = wrapper.read_text()
              text, count = re.subn(
                  r'gradle-[0-9.]+-(?:all|bin)\.zip',
                  'gradle-8.14.3-all.zip',
                  text,
                  count=1,
              )
              if count:
                  wrapper.write_text(text)
                  print("Updated Gradle wrapper.")

          theme = project / "lib/core/theme/app_theme.dart"
          if theme.exists():
              text = theme.read_text()
              text = text.replace(
                  "cardTheme: CardTheme(",
                  "cardTheme: CardThemeData(",
              )
              theme.write_text(text)

          tool_panel = project / "lib/presentation/widgets/editor/tool_panel.dart"
          if tool_panel.exists():
              text = tool_panel.read_text()
              text = text.replace("Icons.transition", "Icons.swap_horiz")
              tool_panel.write_text(text)

          inspector = project / "lib/presentation/widgets/editor/clip_inspector.dart"
          if inspector.exists():
              text = inspector.read_text()
              text = text.replace(
                  ".clamp(1, double.infinity)",
                  ".clamp(1.0, double.infinity).toDouble()",
              )
              text = text.replace(".clamp(0, max)", ".clamp(0.0, max).toDouble()")
              inspector.write_text(text)

          print("Android compatibility patch completed.")
          PY

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter --version
          flutter pub get

      - name: Analyze Dart code
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          flutter analyze

      - name: Run tests
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-edit-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
