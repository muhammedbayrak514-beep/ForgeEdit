
name: Forge Edit APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project
        shell: bash
        run: |
          unzip -o forge_edit_github_ready.zip -d source
          PROJECT="$(dirname "$(find source -name pubspec.yaml -print -quit)")"
          test -f "$PROJECT/pubspec.yaml"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Fix known Dart compile errors
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"]) / "lib"

          def patch(file, replacements):
              path = root / file
              text = path.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(
                          f"Beklenen kod bulunamadı: {file}: {old!r}"
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text)
              print("Düzeltildi:", file)

          patch("core/theme/app_theme.dart", [
              ("cardTheme: CardTheme(", "cardTheme: CardThemeData("),
          ])

          patch("presentation/widgets/editor/preview_panel.dart", [
              ("                          _TextOverlays(projectId: projectId),\n", ""),
          ])

          patch("presentation/widgets/editor/tool_panel.dart", [
              ("Icons.transition", "Icons.swap_horiz"),
          ])

          patch("presentation/widgets/editor/clip_inspector.dart", [
              (
                  "final max = clip.sourceDurationMs.toDouble().clamp(1, double.infinity);",
                  "final max = clip.sourceDurationMs.toDouble().clamp(1.0, double.infinity).toDouble();"
              ),
              (
                  "clip.trimStartMs.toDouble().clamp(0, max)",
                  "clip.trimStartMs.toDouble().clamp(0.0, max).toDouble()"
              ),
              (
                  "clip.trimEndMs.toDouble().clamp(0, max)",
                  "clip.trimEndMs.toDouble().clamp(0.0, max).toDouble()"
              ),
          ])

          patch("data/services/export_service.dart", [
              (
                  "        // Guarantee stereo AAC so concat never mixes A/V stream layouts\n"
                  "        final ensured = await _ensureSegmentHasAudio(\n"
                  "          segmentPaths[i],\n"
                  "          durationMs: plan.videoTrack[i].durationMs,\n"
                  "          settings: settings,\n"
                  "        );\n"
                  "        if (!ensured) {\n"
                  "          await _cleanupPartial(outputPath, workDir);\n"
                  "          return ExportProgress(\n"
                  "            phase: ExportPhase.failed,\n"
                  "            message: 'Segment ses akışı oluşturulamadı',\n"
                  "            error: segmentPaths[i],\n"
                  "          );\n"
                  "        }\n",
                  ""
              ),
          ])
          PY

      - name: Install Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze Dart code
        run: |
          cd "$PROJECT_DIR"
          flutter analyze

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeEdit-APK
          path: source/**/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
