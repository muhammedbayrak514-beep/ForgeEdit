name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Flutter project layout
        run: |
          set -e
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la
          if [ ! -f pubspec.yaml ]; then
            echo "::error::pubspec.yaml yok. Repo köküne Flutter projesini push et."
            exit 1
          fi
          if [ ! -d android ]; then
            echo "::error::android/ klasörü yok. GitHub'a eksik yüklenmiş."
            exit 1
          fi
          ls -la android/ android/app/ 2>/dev/null || true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # cache:gradle KULLANILMIYOR — Flutter projelerinde gradle dosyaları
          # android/ altında; v4 cache tarama hatası veriyordu.

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: List APK outputs
        run: find build/app/outputs/flutter-apk -type f -name '*.apk' -ls || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-edit-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
