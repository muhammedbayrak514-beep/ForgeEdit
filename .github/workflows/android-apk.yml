name: Forge Edit Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Prepare, test, and build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Locate or extract Flutter project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          if [[ -f "$ROOT/pubspec.yaml" ]]; then
            PROJECT_DIR="$ROOT"
          elif [[ -f "$ROOT/forge_edit/pubspec.yaml" ]]; then
            PROJECT_DIR="$ROOT/forge_edit"
          else
            ZIP_FILE=""
            for candidate in \
              "$ROOT/forge_edit_github_ready.zip" \
              "$ROOT/forge_edit_stage9_final.zip"; do
              if [[ -f "$candidate" ]]; then
                ZIP_FILE="$candidate"
                break
              fi
            done

            if [[ -z "$ZIP_FILE" ]]; then
              ZIP_FILE="$(find "$ROOT" -maxdepth 1 -type f -name '*.zip' -print -quit || true)"
            fi

            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: Flutter project ZIP not found." >&2
              exit 1
            fi

            EXTRACT_DIR="$ROOT/.ci-build-source"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            PUBSPEC="$(find "$EXTRACT_DIR" -type f -name pubspec.yaml -print -quit)"
            if [[ -z "$PUBSPEC" ]]; then
              echo "ERROR: pubspec.yaml not found in ZIP." >&2
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PUBSPEC")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project path: $PROJECT_DIR"

      - name: Fix Android toolchain and known Dart compile errors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])

          def replace_once(path, old, new, label):
              source = path.read_text(encoding="utf-8")
              if old in source:
                  path.write_text(
                      source.replace(old, new, 1),
                      encoding="utf-8",
                  )
                  print(f"FIXED: {label}")
              elif new in source:
                  print(f"OK: {label} already fixed")
              else:
                  raise RuntimeError(
                      f"{label}: expected code not found in {path}"
                  )

          # Android Gradle Plugin and Kotlin versions.
          settings = project / "android/settings.gradle"
          text = settings.read_text(encoding="utf-8")

          text, agp_count = re.subn(
              r'(id\s+"com\.android\.application"\s+version\s+")[^"]+("\s+apply\s+false)',
              r'\g<1>8.11.1\2',
              text,
              count=1,
          )
          text, kotlin_count = re.subn(
              r'(id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+")[^"]+("\s+apply\s+false)',
              r'\g<1>2.2.20\2',
              text,
              count=1,
          )

          if not agp_count or not kotlin_count:
              raise RuntimeError(
                  "Could not update AGP/Kotlin in android/settings.gradle"
              )

          settings.write_text(text, encoding="utf-8")
          print("FIXED: Android Gradle Plugin 8.11.1 / Kotlin 2.2.20")

          # Gradle wrapper.
          wrapper = project / "android/gradle/wrapper/gradle-wrapper.properties"
          text = wrapper.read_text(encoding="utf-8")
          text, count = re.subn(
              r'gradle-[0-9.]+-all\.zip',
              "gradle-8.14.3-all.zip",
              text,
              count=1,
          )

          if not count:
              raise RuntimeError("Gradle wrapper distribution URL not found.")

          wrapper.write_text(text, encoding="utf-8")
          print("FIXED: Gradle 8.14.3")

          # Flutter's updated Material API.
          replace_once(
              project / "lib/core/theme/app_theme.dart",
              "cardTheme: CardTheme(",
              "cardTheme: CardThemeData(",
              "CardThemeData",
          )

          # Fix the missing text overlay used by PreviewPanel.
          preview = project / "lib/presentation/widgets/editor/preview_panel.dart"
          text = preview.read_text(encoding="utf-8")

          if "class _TextOverlays extends ConsumerWidget" not in text:
              marker = "class _VideoSurface extends StatelessWidget {"

              if marker not in text:
                  raise RuntimeError(
                      "Could not find insertion point in preview_panel.dart"
                  )

              overlay = '''class _TextOverlays extends ConsumerWidget {
            final String projectId;

            const _TextOverlays({required this.projectId});

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              final project = ref.watch(editorProvider(projectId)).value;
              final timelineMs =
                  ref.watch(timelineClockProvider(projectId)).positionMs;

              final overlays = (project?.clips ?? const <ClipModel>[])
                  .where((clip) =>
                      clip.type == ClipType.text &&
                      timelineMs >= clip.timelineStartMs &&
                      timelineMs < clip.timelineEndMs)
                  .toList();

              if (overlays.isEmpty) {
                return const SizedBox.shrink();
              }

              return Stack(
                children: overlays.map((clip) {
                  final x =
                      (clip.posX * 2 - 1).clamp(-1.0, 1.0).toDouble();
                  final y =
                      (clip.posY * 2 - 1).clamp(-1.0, 1.0).toDouble();

                  final alignment = clip.textAlign == 0
                      ? TextAlign.left
                      : clip.textAlign == 2
                          ? TextAlign.right
                          : TextAlign.center;

                  return Positioned.fill(
                    child: Align(
                      alignment: Alignment(x, y),
                      child: Padding(
                        padding: const EdgeInsets.all(12),
                        child: Text(
                          clip.textContent,
                          textAlign: alignment,
                          style: TextStyle(
                            color: Color(clip.textColorArgb),
                            fontSize:
                                clip.fontSize.clamp(8.0, 200.0).toDouble(),
                            shadows: const [
                              Shadow(
                                color: Colors.black,
                                blurRadius: 4,
                                offset: Offset(1, 1),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  );
                }).toList(),
              );
            }
          }

          '''

              preview.write_text(
                  text.replace(marker, overlay + marker, 1),
                  encoding="utf-8",
              )
              print("FIXED: Added _TextOverlays")
          else:
              print("OK: _TextOverlays already exists")

          # Missing icon in the transition tool.
          replace_once(
              project / "lib/presentation/widgets/editor/tool_panel.dart",
              "Icons.transition",
              "Icons.swap_horiz",
              "Transition icon",
          )

          # Make slider values explicitly double.
          inspector = project / "lib/presentation/widgets/editor/clip_inspector.dart"

          replace_once(
              inspector,
              "final max = clip.sourceDurationMs.toDouble().clamp(1, double.infinity);",
              "final max = clip.sourceDurationMs.toDouble().clamp(1.0, double.infinity).toDouble();",
              "Slider max type",
          )

          replace_once(
              inspector,
              "value: clip.trimStartMs.toDouble().clamp(0, max),",
              "value: clip.trimStartMs.toDouble().clamp(0.0, max).toDouble(),",
              "Trim start slider type",
          )

          replace_once(
              inspector,
              "value: clip.trimEndMs.toDouble().clamp(0, max),",
              "value: clip.trimEndMs.toDouble().clamp(0.0, max).toDouble(),",
              "Trim end slider type",
          )

          # Restore the missing audio-check helper used by ExportService.
          export_file = project / "lib/data/services/export_service.dart"
          text = export_file.read_text(encoding="utf-8")

          probe_import = (
              "import 'package:ffmpeg_kit_flutter_new/ffprobe_kit.dart';"
          )
          if probe_import not in text:
              old_import = (
                  "import 'package:ffmpeg_kit_flutter_new/ffmpeg_session.dart';"
              )
              if old_import not in text:
                  raise RuntimeError(
                      "Could not find FFmpeg import in export_service.dart"
                  )
              text = text.replace(
                  old_import,
                  old_import + "\n" + probe_import,
                  1,
              )

          text = text.replace(
              '''final ensured = await _ensureSegmentHasAudio(
                    segmentPaths[i],
                    durationMs: plan.videoTrack[i].durationMs,
                    settings: settings,
                  );''',
              '''final ensured = await _ensureSegmentHasAudio(
                    segmentPaths[i],
                    durationMs: plan.videoTrack[i].durationMs,
                  );''',
              1,
          )

          text = text.replace(
              'durationMs: plan.videoTrack[i].durationMs,\n          settings: settings,\n        );',
              'durationMs: plan.videoTrack[i].durationMs,\n        );',
              1,
          )

          if "Future<bool> _ensureSegmentHasAudio(" not in text:
              marker = "  Future<void> _cleanupPartial("
              if marker not in text:
                  raise RuntimeError(
                      "Could not find helper insertion point in export_service.dart"
                  )

              helper = '''  Future<bool> _ensureSegmentHasAudio(
              String segmentPath, {
              required int durationMs,
            }) async {
              try {
                final probeSession =
                    await FFprobeKit.getMediaInformation(segmentPath);
                final information =
                    await probeSession.getMediaInformation();

                if (information == null) return false;

                final hasAudio = information
                    .getStreams()
                    .any((stream) => stream.getType() == 'audio');

                if (hasAudio) return true;

                final durationSec = (durationMs / 1000.0)
                    .clamp(0.1, 3600.0)
                    .toStringAsFixed(3);

                final fixedPath = segmentPath.replaceFirst(
                  RegExp(r'\\.mp4$', caseSensitive: false),
                  '_audiofix.mp4',
                );

                final command =
                    '-i "$segmentPath" '
                    '-f lavfi -t $durationSec '
                    '-i anullsrc=channel_layout=stereo:sample_rate=44100 '
                    '-map 0:v:0 -map 1:a:0 '
                    '-c:v copy -c:a aac -b:a 128k '
                    '-ar 44100 -ac 2 -t $durationSec -y "$fixedPath"';

                final ok = await _runAsync(command);
                final fixedFile = File(fixedPath);

                if (!ok ||
                    !await fixedFile.exists() ||
                    await fixedFile.length() == 0) {
                  if (await fixedFile.exists()) {
                    await fixedFile.delete();
                  }
                  return false;
                }

                await fixedFile.copy(segmentPath);
                await fixedFile.delete();
                return true;
              } catch (error) {
                print('Segment audio check failed: $error');
                return false;
              }
            }

          '''

              text = text.replace(marker, helper + marker, 1)
              print("FIXED: Added _ensureSegmentHasAudio")
          else:
              print("OK: _ensureSegmentHasAudio already exists")

          export_file.write_text(text, encoding="utf-8")
          PY

      - name: Download Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter --version
          flutter pub get

      - name: Run Dart analyzer
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          flutter analyze

      - name: Run tests
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          flutter test

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-edit-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14