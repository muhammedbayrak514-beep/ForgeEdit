
name: Forge Edit APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project
        shell: bash
        run: |
          unzip -o forge_edit_github_ready.zip -d source
          PROJECT="$(dirname "$(find source -name pubspec.yaml -print -quit)")"
          if [ ! -f "$PROJECT/pubspec.yaml" ]; then
            echo "HATA: pubspec.yaml bulunamadı"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proje: $PROJECT"

      - name: Upgrade Android build versions
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import os
          import re

          project = os.environ["PROJECT_DIR"]
          settings = os.path.join(project, "android", "settings.gradle")
          wrapper = os.path.join(
              project, "android", "gradle", "wrapper",
              "gradle-wrapper.properties"
          )

          with open(settings, encoding="utf-8") as f:
              content = f.read()

          content, agp_count = re.subn(
              r'(com\.android\.application"\s+version\s+")([^"]+)(")',
              r'\g<1>8.11.1\3',
              content
          )
          content, kotlin_count = re.subn(
              r'(org\.jetbrains\.kotlin\.android"\s+version\s+")([^"]+)(")',
              r'\g<1>2.2.20\3',
              content
          )

          if agp_count == 0:
              raise SystemExit(
                  "Android Gradle Plugin satırı bulunamadı: settings.gradle"
              )
          if kotlin_count == 0:
              raise SystemExit(
                  "Kotlin sürüm satırı bulunamadı: settings.gradle"
              )

          with open(settings, "w", encoding="utf-8") as f:
              f.write(content)

          with open(wrapper, encoding="utf-8") as f:
              content = f.read()

          content, gradle_count = re.subn(
              r'gradle-8\.3-all\.zip',
              'gradle-8.14.3-all.zip',
              content
          )

          if gradle_count == 0 and "gradle-8.14.3-all.zip" not in content:
              raise SystemExit("Gradle wrapper sürümü güncellenemedi")

          with open(wrapper, "w", encoding="utf-8") as f:
              f.write(content)

          print("Android Gradle Plugin: 8.11.1")
          print("Kotlin: 2.2.20")
          print("Gradle: 8.14.3")
          PY

      - name: Install Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeEdit-APK
          path: source/**/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
