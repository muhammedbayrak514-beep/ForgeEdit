
name: Forge Edit APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project
        run: |
          unzip -o forge_edit_github_ready.zip -d source
          PROJECT="$(dirname "$(find source -name pubspec.yaml -print -quit)")"
          if [ ! -f "$PROJECT/pubspec.yaml" ]; then
            echo "HATA: pubspec.yaml bulunamadı"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proje: $PROJECT"

      - name: Upgrade Android build versions
        run: |
          sed -i 's/gradle-8\.3-all.zip/gradle-8.14.3-all.zip/' "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          sed -i 's/com.android.application" version "8.1.0"/com.android.application" version "8.11.1"/' "$PROJECT_DIR/android/settings.gradle"
          echo "Gradle:"
          cat "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          echo "Android Gradle Plugin:"
          grep 'com.android.application' "$PROJECT_DIR/android/settings.gradle"

      - name: Install Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeEdit-APK
          path: source/**/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
