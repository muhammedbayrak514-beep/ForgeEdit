# ForgeEdit — Android APK (GitHub Actions)
# Repo: muhammedbayrak514-beep/ForgeEdit
# Yol: .github/workflows/android-apk.yml
name: ForgeEdit Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project root (source or zip)
        run: |
          set -euo pipefail
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -la

          # Zaten Flutter köküyse devam
          if [ -f pubspec.yaml ] && [ -d android ] && [ -d lib ]; then
            echo "OK: Flutter projesi repo kökünde."
            exit 0
          fi

          # Zip ile yüklenmişse aç
          ZIP=""
          for candidate in \
            forge_edit_for_actions.zip \
            ForgeEdit_TAM_PROJE.zip \
            forge_edit_github.zip \
            forge-edit-release-apk.zip \
            forge_edit.zip; do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -type f -name '*.zip' ! -path './.git/*' | head -n 1 || true)
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::pubspec.yaml yok ve zip de bulunamadı."
            echo "Repo köküne Flutter projesini VEYA forge_edit_for_actions.zip yükle."
            exit 1
          fi

          echo "Zip açılıyor: $ZIP"
          mkdir -p _extract
          unzip -q -o "$ZIP" -d _extract

          # Zip içinde kök veya alt klasör olabilir
          SRC=""
          if [ -f _extract/pubspec.yaml ]; then
            SRC="_extract"
          else
            SRC=$(find _extract -maxdepth 3 -type f -name pubspec.yaml | head -n 1 | xargs -r dirname || true)
          fi

          if [ -z "$SRC" ] || [ ! -f "$SRC/pubspec.yaml" ]; then
            echo "::error::Zip içinde pubspec.yaml bulunamadı."
            find _extract -maxdepth 3 -type f | head -50
            exit 1
          fi

          echo "Kaynak: $SRC"
          # Gerekli dosyaları workspace köküne taşı
          shopt -s dotglob
          cp -a "$SRC"/* "$GITHUB_WORKSPACE"/
          shopt -u dotglob

          if [ ! -f pubspec.yaml ] || [ ! -d android ] || [ ! -d lib ]; then
            echo "::error::Kopyalama sonrası proje eksik (pubspec/android/lib)."
            ls -la
            exit 1
          fi
          echo "OK: Proje hazır."
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tool versions
        run: |
          flutter --version
          java -version
          echo "Gradle wrapper:"
          cat android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (non-fatal)
        run: flutter analyze --no-fatal-infos || true

      - name: Unit tests (non-fatal)
        run: flutter test || true

      - name: Build release APK
        run: flutter build apk --release

      - name: List APK files
        run: find build/app/outputs/flutter-apk -type f -name '*.apk' -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-edit-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
