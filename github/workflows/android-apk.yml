
name: ForgeEdit APK Builder

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgeedit-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ForgeEdit for Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f pubspec.yaml ]]; then
            echo "::error::pubspec.yaml bulunamadi."
            echo "ForgeEdit ZIP dosyasini ac ve proje dosyalarini depo kokune yukle."
            exit 1
          fi

          test -d lib || {
            echo "::error::lib klasoru bulunamadi."
            exit 1
          }

          test -d android || {
            echo "::error::android klasoru bulunamadi."
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK files
        shell: bash
        run: |
          set -euo pipefail
          find build/app/outputs/flutter-apk \
            -maxdepth 1 -type f -name '*.apk' -print

          test -n "$(find build/app/outputs/flutter-apk \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-edit-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
